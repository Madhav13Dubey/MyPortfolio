name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '22 12 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue has had no activity for 30 days and will close in 7 unless updated.'
          stale-pr-message: 'This PR has had no activity for 30 days and will close in 7 unless updated.'
          days-before-stale: 30
          days-before-close: 7
